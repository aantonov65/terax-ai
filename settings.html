<!doctype html>
<html lang="en" style="background: #17181b; color: #e5e7eb">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wwworkbench — Settings</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("terax-ui-theme-shadow");
          var resolved =
            t === "light" || t === "dark"
              ? t
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(resolved);
          document.documentElement.style.backgroundColor = "#17181b";
        } catch (e) {}
      })();
    </script>
  </head>

  <body style="margin: 0; background: #17181b; color: #e5e7eb">
    <div id="settings-root"></div>
    <script type="module" src="/src/settings/main.tsx"></script>
  </body>
</html>
